<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" type="image/x-icon" href="/assets/icon.ico">
		<link rel="icon" type="image/png" href="/assets/icon-512.png">
		<title>Overlay - Le Maillon Faible</title>
		<link rel="stylesheet" href="/overlay/style.css">
	</head>
	<body>
		<main class="overlay" aria-live="polite">
			<section class="score">
				<span>Banque totale</span>
				<strong id="bank">0€</strong>
			</section>
			<section class="score">
				<span>Cash du tour</span>
				<strong id="cash">0€</strong>
			</section>
			<section class="center">
				<strong id="status">En attente</strong>
				<em id="timer"></em>
			</section>
			<section class="score right">
				<span>Prochain palier</span>
				<strong id="next-chain">0€</strong>
			</section>
		</main>
		<script type="module" src="/overlay/main.js"></script>
	</body>
</html>

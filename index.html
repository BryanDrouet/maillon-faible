<!DOCTYPE html>
<html lang="fr">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Application interactive et en temps réel pour jouer au Maillon Faible, synchronisée via Firebase.">
    <meta name="keywords" content="jeu, maillon faible, interactif, multijoueur, firebase, temps réel">
    <meta name="author" content="ClubRadio">
    <meta name="robots" content="index, follow">
    <title>Le Maillon Faible</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="rgpd-container" class="hidden" aria-hidden="true">
        <div role="dialog" aria-labelledby="rgpd-title" aria-describedby="rgpd-desc" class="rgpd-modal">
            <h2 id="rgpd-title"></h2>
            <p id="rgpd-desc"></p>
            <div class="rgpd-actions">
                <button id="rgpd-accept" aria-label="Accepter les cookies"></button>
                <button id="rgpd-decline" aria-label="Refuser les cookies"></button>
            </div>
        </div>
    </div>

    <main id="app-container">
        <header>
            <h1 id="main-title"></h1>
            <div id="connection-status" aria-live="polite"></div>
        </header>

        <section id="role-selection" class="visible" aria-labelledby="role-title">
            <h2 id="role-title"></h2>
            <form id="role-form">
                <div class="form-group">
                    <label for="player-name" id="label-player-name"></label>
                    <input type="text" id="player-name" name="player_name" aria-required="true" required>
                </div>
                <div class="form-group">
                    <label for="room-id">Code du salon</label>
                    <input type="text" id="room-id" name="room_id" maxlength="6" placeholder="Ex. RADIO1" aria-required="true" required>
                </div>
                <div class="entry-actions">
                    <button type="submit" id="btn-create" name="entry-action" value="create"><i data-lucide="radio"></i> Créer et présenter</button>
                    <button type="submit" id="btn-join" name="entry-action" value="join"><i data-lucide="log-in"></i> <span id="text-join"></span></button>
                </div>
            </form>
        </section>

        <section id="player-view" class="hidden" aria-labelledby="player-title">
            <h2 id="player-title"></h2>
            <p id="player-room-code" class="room-code"></p>
            <div class="game-info">
                <p id="player-bank-display"></p>
                <p id="player-chain-display"></p>
                <p id="player-cash-display"></p>
            </div>
            <p id="player-status" class="game-status" aria-live="polite"></p>
            <button type="button" id="btn-bank" aria-label="Banquer l'argent">
                <i data-lucide="piggy-bank"></i> <span id="text-bank">BANQUE !</span>
            </button>
            <section id="player-vote" class="hidden" aria-labelledby="vote-title">
                <h3 id="vote-title">Votez pour le maillon faible</h3>
                <div id="vote-options" class="vote-options"></div>
            </section>
        </section>

        <section id="gm-view" class="hidden" aria-labelledby="gm-title">
            <h2 id="gm-title"></h2>
            <p id="gm-room-code" class="room-code"></p>
            <div class="game-stats">
                <div class="stat-box">
                    <i data-lucide="coins"></i>
                    <p id="gm-bank-total"></p>
                </div>
                <div class="stat-box">
                    <i data-lucide="trending-up"></i>
                    <p id="gm-current-chain"></p>
                </div>
            </div>
            <div class="bank-alert">
                <i data-lucide="bell"></i>
                <p id="gm-bank-requests" aria-live="assertive"></p>
            </div>
            <div class="question-box">
                <p id="gm-question-text"></p>
                <p id="gm-answer-text"></p>
            </div>
            <p id="gm-round-status" class="game-status" aria-live="polite"></p>
            <div id="gm-player-list" class="player-list"></div>
            <div class="gm-controls">
                <button type="button" id="btn-correct" aria-label="Valider une bonne réponse">
                    <i data-lucide="check-circle"></i> <span id="text-correct"></span>
                </button>
                <button type="button" id="btn-wrong" aria-label="Valider une mauvaise réponse">
                    <i data-lucide="x-circle"></i> <span id="text-wrong"></span>
                </button>
                <button type="button" id="btn-validate-bank" aria-label="Valider la banque demandée">
                    <i data-lucide="check-square"></i> <span id="text-validate-bank"></span>
                </button>
                <button type="button" id="btn-next-question" aria-label="Passer à la question suivante">
                    <i data-lucide="arrow-right-circle"></i> <span id="text-next-question"></span>
                </button>
                <button type="button" id="btn-start" aria-label="Démarrer ou reprendre la manche"><i data-lucide="play-circle"></i> Démarrer la manche</button>
                <button type="button" id="btn-vote" aria-label="Lancer le vote"><i data-lucide="users-round"></i> Lancer le vote</button>
                <button type="button" id="btn-eliminate" aria-label="Éliminer le joueur le plus voté"><i data-lucide="user-minus"></i> Éliminer le plus voté</button>
                <button type="button" id="btn-new-game" aria-label="Nouvelle partie"><i data-lucide="rotate-ccw"></i> Nouvelle partie</button>
            </div>
        </section>

        <section id="overlay-view" class="hidden" aria-label="Overlay de partie">
            <div class="overlay-score"><span>BANQUE</span><strong id="overlay-bank">0 EUR</strong></div>
            <div class="overlay-center"><span id="overlay-room"></span><strong id="overlay-status">EN ATTENTE</strong></div>
            <div class="overlay-score"><span>CHAINE</span><strong id="overlay-chain">0 EUR</strong></div>
        </section>
    </main>

    <footer>
        <p id="copyright-text"></p>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
